services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multitenant_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_only
    ports:
      - "5432:5432"
    volumes:
      - erp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d multitenant_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp-postgres-data:
