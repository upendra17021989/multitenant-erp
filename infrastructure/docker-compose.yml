services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-multitenant_erp}
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-erp}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-erp_local_only}
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - erp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USERNAME:-erp} -d ${LOCAL_DB_NAME:-multitenant_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp-postgres-data:
